*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:tahoma;
}

body{
background:radial-gradient(circle,#0d47a1,#000814);
min-height:100vh;
color:white;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
}

.card{
background:rgba(255,255,255,.12);
backdrop-filter:blur(10px);
border-radius:20px;
padding:20px;
margin-top:20px;
}

h1,h2{
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:15px;
border:none;
border-radius:10px;
margin-bottom:15px;
font-size:18px;
}

button{
background:#ff9800;
border:none;
color:white;
padding:12px;
border-radius:10px;
cursor:pointer;
font-size:18px;
margin:5px;
}

button:hover{
opacity:.9;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:10px;
}

.option{
display:block;
width:100%;
margin-top:10px;
}

.hidden{
display:none;
}

.timer{
font-size:24px;
font-weight:bold;
text-align:center;
margin-bottom:15px;
color:#ffd54f;
}

.progress{
text-align:center;
margin-bottom:15px;
}

.confetti{
position:fixed;top:-20px;font-size:24px;animation:fall 4s linear forwards;z-index:9999;
}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);}}
.flash-correct{background:#2e7d32 !important;}
.flash-wrong{background:#c62828 !important;}


@keyframes dangerFlash{
0%{background:#000814;}
50%{background:#4a0000;}
100%{background:#000814;}
}
.dangerMode{
animation:dangerFlash .6s infinite;
}
@keyframes shake{
0%{transform:translateX(0);}
25%{transform:translateX(-2px);}
50%{transform:translateX(2px);}
75%{transform:translateX(-2px);}
100%{transform:translateX(0);}
}

</style>

function playWarningBeep(){
const ctx=new (window.AudioContext||window.webkitAudioContext)();
const o=ctx.createOscillator();
const g=ctx.createGain();
o.frequency.value=1000;
o.connect(g); g.connect(ctx.destination);
g.gain.value=0.15;
o.start();
o.stop(ctx.currentTime+0.12);
}

function launchCelebration(){
const items=['🎉','🎊','🥇','🏆','⭐','💎'];
for(let i=0;i<80;i++){
let e=document.createElement('div');
e.className='confetti';
e.innerText=items[Math.floor(Math.random()*items.length)];
e.style.left=Math.random()*100+'vw';
e.style.animationDelay=(Math.random()*2)+'s';
document.body.appendChild(e);
setTimeout(()=>e.remove(),6000);
}
}



function playHeartbeat(){
const ctx=new (window.AudioContext||window.webkitAudioContext)();
[0,0.22].forEach(t=>{
 let o=ctx.createOscillator();
 let g=ctx.createGain();
 o.type='sawtooth';
 o.frequency.value=70;
 o.connect(g);
 g.connect(ctx.destination);
 g.gain.setValueAtTime(0.9,ctx.currentTime+t);
 g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+0.25);
 o.start(ctx.currentTime+t);
 o.stop(ctx.currentTime+t+0.25);
});
}

function playBackgroundMusic(){
const ctx=new (window.AudioContext||window.webkitAudioContext)();
setInterval(()=>{
 let o=ctx.createOscillator();
 let g=ctx.createGain();
 o.frequency.value=220;
 o.connect(g); g.connect(ctx.destination);
 g.gain.value=0.01;
 o.start();
 o.stop(ctx.currentTime+0.4);
},1200);
}

function championAnimation(){
launchCelebration();
for(let i=0;i<150;i++) launchCelebration();
}

function playCrowd(){
const ctx=new (window.AudioContext||window.webkitAudioContext)();
for(let i=0;i<12;i++){
let o=ctx.createOscillator();
let g=ctx.createGain();
o.frequency.value=400+Math.random()*500;
o.connect(g); g.connect(ctx.destination);
g.gain.value=0.03;
o.start(ctx.currentTime+i*0.08);
o.stop(ctx.currentTime+i*0.08+0.2);
}
}

function saveTopScore(name,score){
let scores=JSON.parse(localStorage.getItem('topScores')||'[]');
scores.push({name,score});
scores.sort((a,b)=>b.score-a.score);
scores=scores.slice(0,10);
localStorage.setItem('topScores',JSON.stringify(scores));
}

function getTopScoresHTML(){
let scores=JSON.parse(localStorage.getItem('topScores')||'[]');
let html='<h2>🏆 رکوردهای برتر</h2><ol>';
scores.forEach(s=>html+=`<li>${s.name} - ${s.score}</li>`);
html+='</ol>';
return html;
}

let lastWarningSecond=-1;
let player="";
let currentTopic=[];
let currentIndex=0;
let score=0;
let timer;
let timeLeft=20;

const topicsDiv=document.getElementById("topics");

for(let topic in questions){

const btn=document.createElement("button");

btn.innerText=topic;

btn.onclick=()=>selectTopic(topic);

topicsDiv.appendChild(btn);
}

function startGame(){

player=document.getElementById("playerName").value.trim();

if(player===""){
alert("نام را وارد کنید");
return;
}

document.getElementById("startPage").classList.add("hidden");

document.getElementById("menuPage").classList.remove("hidden"); playBackgroundMusic();
}

function selectTopic(topic){

currentTopic=[...questions[topic]].sort(()=>Math.random()-0.5).slice(0,10);

currentIndex=0;

score=0;

document.getElementById("menuPage").classList.add("hidden");

document.getElementById("quizPage").classList.remove("hidden");

loadQuestion();
}

function loadQuestion(){

if(currentIndex>=currentTopic.length){
finishQuiz();
return;
}

let q=currentTopic[currentIndex];

document.getElementById("progress").innerText=
`سوال ${currentIndex+1} از ${currentTopic.length}`;

document.getElementById("question").innerText=q.q;

const answers=document.getElementById("answers");

answers.innerHTML="";

q.options.forEach((opt,index)=>{

let btn=document.createElement("button");

btn.className="option";

btn.innerText=opt;

btn.onclick=()=>checkAnswer(index);

answers.appendChild(btn);
});

startTimer();
}

function startTimer(){

clearInterval(timer);

timeLeft=20;

document.getElementById("time").innerText=timeLeft;
if(timeLeft<=5 && timeLeft>0){
if(lastWarningSecond!==timeLeft){
lastWarningSecond=timeLeft;
const s=document.getElementById('last5Warning');
if(s){
s.currentTime=0;
s.play().catch(()=>{});
}
}
}else{
lastWarningSecond=-1;
}
if(timeLeft<=5 && timeLeft>0){ playWarningBeep(); }

timer=setInterval(()=>{

timeLeft--;

document.getElementById("time").innerText=timeLeft;

if(timeLeft<=5 && timeLeft>0){
playHeartbeat();
document.body.classList.add('dangerMode');
document.body.style.animation='shake .15s infinite';
}else{
document.body.classList.remove('dangerMode');
document.body.style.animation='';
}

if(timeLeft<=0){
document.body.classList.remove('dangerMode');
document.body.style.animation='';

clearInterval(timer);

currentIndex++;

loadQuestion();
}

},1000);
}

function checkAnswer(index){

clearInterval(timer);
const page=document.body;

if(index===currentTopic[currentIndex].answer){
document.getElementById("correctSound").play();
page.classList.add("flash-correct");
score++;
}else{
document.getElementById("wrongSound").play();
page.classList.add("flash-wrong");
}

setTimeout(()=>{
page.classList.remove("flash-correct");
page.classList.remove("flash-wrong");
currentIndex++;
loadQuestion();
},700);
}

function finishQuiz(){saveHighScore(player,score); saveTopScore(player,score); playCrowd();

const bestScore=localStorage.getItem("bestScore");
const bestPlayer=localStorage.getItem("bestPlayer");

document.getElementById("quizPage").classList.add("hidden");

document.getElementById("resultPage").classList.remove("hidden");

let medal="بدون مدال";
if(score>=5 && score<=6) medal="🥉 برنز";
if(score===7) medal="🥈 نقره";
if(score===8) medal="🥇 طلا";
if(score===9) medal="💎 الماس";
if(score===10) medal="🏆 کاپ قهرمانی";

launchCelebration();
if(score===10){for(let i=0;i<1000;i++){launchCelebration();} championAnimation();}
document.getElementById("resultPage").innerHTML=`

<h1>نتیجه نهایی</h1>

<h2>${player}</h2>

<h2>امتیاز: ${score}</h2>

<h1>${medal}</h1>

<button onclick="location.reload()">
شروع دوباره
</button>
<div style='margin-top:20px'>${getTopScoresHTML()}</div>
`;

}
function saveHighScore(name,score){

let bestScore=localStorage.getItem("bestScore") || 0;
let bestPlayer=localStorage.getItem("bestPlayer") || "";

if(score > bestScore){

localStorage.setItem("bestScore",score);
localStorage.setItem("bestPlayer",name);

}

}
